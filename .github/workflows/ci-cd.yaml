name: CI/CD Rust - Build & Deploy Docker

on:
  push:
    branches: [ main ]
    # Só dispara automaticamente se algo que afeta o build/deploy mudou.
    paths:
      - '**.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Dockerfile'
      - 'docker-compose.yaml'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
      - '**.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Dockerfile'
      - 'docker-compose.yaml'
      - '.github/workflows/**'
  workflow_dispatch:

# Evita dois deploys rodando ao mesmo tempo na mesma VPS se dois pushes
# chegarem em sequência rápida.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cargo check
        run: cargo check --locked || cargo check

      - name: Cargo test
        run: cargo test --locked || cargo test

      - name: Cargo clippy
        run: cargo clippy -- -D warnings || true

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Roda em push direto na main OU quando disparado manualmente
    # (workflow_dispatch) na main. Nunca em pull_request.
    if: github.ref_name == 'main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Alvo é o Raspberry Pi (aarch64). O Dockerfile usa o truque
          # --platform=$BUILDPLATFORM no estágio de build, então isto
          # faz cross-compile nativo (sem QEMU) em vez de emular arm64
          # inteiro no runner amd64 — bem mais rápido.
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Mesma condição do build-and-push: push direto na main ou disparo
    # manual na main. Nunca em pull_request ou outras branches.
    if: github.ref_name == 'main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      # Necessário para o docker-compose.yaml existir no runner antes do SCP.
      - uses: actions/checkout@v4

      # Entra no tailnet como nó efêmero. Depois deste passo o runner
      # enxerga o Pi pelo IP/hostname Tailscale.
      - name: Conectar ao tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          # Precisa listar exatamente o mesmo conjunto de tags autorizado
          # no OAuth client (Trust credentials → Scopes → Tags).
          tags: tag:ci,tag:rasp

      - name: Debug - conectividade com o Pi
        run: |
          echo "--- VPS_HOST usado (mascarado pelo GH, mas confirmamos tamanho) ---"
          echo -n "${{ secrets.VPS_HOST }}" | wc -c
          echo "--- tailscale status ---"
          tailscale status
          echo "--- resolvendo/pingando o host ---"
          tailscale ping -c 3 "${{ secrets.VPS_HOST }}" || true
          echo "--- teste TCP na porta 22 ---"
          nc -zv -w5 "${{ secrets.VPS_HOST }}" 22 || true
          echo "--- ssh manual verboso ---"
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          timeout 20 ssh -vvv -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i /tmp/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "echo conectou" 2>&1 | tail -80 || true
          rm -f /tmp/deploy_key

      - name: Garantir pasta de deploy no Pi
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -euo pipefail
            mkdir -p "$HOME/ghdeploy/phonecam"
            # O container roda como UID 65532 (não-root).
            sudo chown -R 65532:65532 "$HOME/ghdeploy/phonecam" || true

      - name: Copiar docker-compose.yaml para o Pi
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "docker-compose.yaml"
          target: "ghdeploy/phone-cam-telegram"
          overwrite: true
          strip_components: 0

      - name: Deploy no Servidor via SSH (via Tailscale)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -euo pipefail
            cd "$HOME/ghdeploy/phone-cam-telegram"
            IMAGE="ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.sha }}"
            echo "🔄 Baixando imagem $IMAGE ..."
            docker pull "$IMAGE"
            # Atualiza a tag latest localmente
            docker tag "$IMAGE" "ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest"
            echo "✅ Imagem pronta. Use:"
            echo "   cd ~/ghdeploy/phone-cam-telegram"
            echo "   TELEGRAM_BOT_TOKEN=... TELEGRAM_CHAT_ID=... docker compose run --rm phone-cam --facing back"
            echo "🧹 Limpando imagens antigas (mais de 24h)..."
            docker image prune -f --filter "until=24h" || true
            echo "✅ Deploy concluído com sucesso!"
